<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Verification — SMMZONE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-main: #0b1120;
    --bg-card: #111827;
    --bg-card2: #0f1a2e;
    --border: #1e293b;
    --border-focus: #334155;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: rgba(37, 99, 235, 0.12);
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.1);
    --warning: #f59e0b;
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-sub: #64748b;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Grid & Ambient Glow */
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }
  .bg-glow {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    padding: 32px 28px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    position: relative;
    z-index: 1;
    text-align: center;
    animation: fadeUp 0.4s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .brand-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-card2); border: 1px solid var(--border);
    border-radius: 100px; padding: 4px 14px;
    font-size: 11px; font-weight: 700; color: #38bdf8;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 18px;
  }
  .brand-badge::before {
    content: ''; width: 6px; height: 6px;
    border-radius: 50%; background: #38bdf8;
  }

  .auth-icon-wrap {
    width: 52px; height: 52px;
    background: var(--primary-light);
    border: 1px solid rgba(37, 99, 235, 0.3);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--primary);
    margin: 0 auto 16px;
  }

  .auth-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; letter-spacing: -0.3px; }
  .auth-sub   { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }

  /* 6-Digit OTP Inputs */
  .otp-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .otp-input {
    width: 100%; height: 54px;
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: monospace;
    font-size: 22px; font-weight: 800;
    color: #fff;
    text-align: center;
    outline: none;
    transition: all 0.15s ease;
  }
  .otp-input:focus {
    border-color: var(--primary);
    background: #0e1726;
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  /* Submit Button */
  .btn-submit {
    width: 100%; padding: 14px;
    border-radius: 12px; border: none;
    background: var(--primary); color: #fff;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }

  /* Security meta info */
  .meta-info-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; color: var(--text-muted); margin-top: 14px;
  }
  .meta-info-row span { display: flex; align-items: center; gap: 5px; }
  .meta-info-row i { color: var(--success); }
  .timer-val { font-weight: 700; color: var(--warning); font-family: monospace; font-size: 12px; }

  .divider {
    height: 1px; background: var(--border);
    margin: 22px 0;
  }

  /* CAPTCHA Card */
  .captcha-box {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
  }
  .captcha-box:hover { border-color: var(--border-focus); }
  .captcha-left { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: var(--text-main); }

  .captcha-checkbox {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: 2px solid var(--border-focus);
    background: var(--bg-main);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .captcha-checkbox.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    font-size: 13px;
  }
  .captcha-brand { font-size: 9px; color: var(--text-sub); text-align: right; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

  /* Recovery Footer */
  .recovery-block {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .recovery-link {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    transition: color 0.15s;
  }
  .recovery-link:hover { color: #7dd3fc; text-decoration: underline; }

  /* Feedback message */
  .status-msg {
    display: none; padding: 10px; border-radius: 8px; font-size: 12px;
    margin-bottom: 16px; text-align: left;
  }
  .status-msg.error {
    display: block; background: var(--danger-bg);
    border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="auth-card">

  <div class="brand-badge">SMMZONE Security</div>

  <div class="auth-icon-wrap">
    <i class="fas fa-lock"></i>
  </div>

  <h1 class="auth-title">Ikki bosqichli tasdiqlash</h1>
  <p class="auth-sub">
    Admin panelga kirishni yakunlash uchun 6 xonali xavfsizlik kodini kiriting.
  </p>

  <div class="status-msg" id="status-msg"></div>

  <!-- OTP Inputs -->
  <div class="otp-grid">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autofocus autocomplete="off">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="off">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="off">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="off">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="off">
    <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="off">
  </div>

  <button type="button" class="btn-submit" id="btn-submit" onclick="handleVerification()">
    <i class="fas fa-shield-check"></i> Tasdiqlash
  </button>

  <div class="meta-info-row">
    <span><i class="fas fa-shield-halved"></i> Xavfsiz ulanish</span>
    <span><i class="fas fa-clock" style="color:var(--warning);"></i> Kod amal qiladi: <b class="timer-val" id="countdown">60s</b></span>
  </div>

  <div class="divider"></div>

  <!-- Captcha -->
  <div class="captcha-box" onclick="toggleCaptcha()">
    <div class="captcha-left">
      <div class="captcha-checkbox" id="captcha-check"></div>
      <span>Men robot emasman</span>
    </div>
    <div class="captcha-brand">
      <i class="fas fa-robot" style="font-size: 14px; display: block; margin-bottom: 2px; color: var(--text-sub);"></i>
      CAPTCHA
    </div>
  </div>

  <div class="divider"></div>

  <!-- Recovery -->
  <div class="recovery-block">
    <div>Muammo bormi?</div>
    <a href="javascript:void(0)" onclick="promptRecovery()" class="recovery-link">
      <i class="fas fa-key"></i> Admin xavfsizlik kaliti orqali qayta tiklash
    </a>
  </div>

</div>

<script>
  // OTP Input Auto-focus & Backspace handling
  const inputs = document.querySelectorAll('.otp-input');

  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value;
      if (!/^\d*$/.test(val)) {
        e.target.value = '';
        return;
      }
      if (val.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
      }
    });

    // Paste qo'llab-quvvatlash
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
      if (/^\d{6}$/.test(pasteData)) {
        pasteData.split('').forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });
        inputs[inputs.length - 1].focus();
      }
    });
  });

  // Captcha State
  let isCaptchaVerified = false;
  function toggleCaptcha() {
    const box = document.getElementById('captcha-check');
    if (!isCaptchaVerified) {
      box.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      setTimeout(() => {
        isCaptchaVerified = true;
        box.className = 'captcha-checkbox checked';
        box.innerHTML = '<i class="fas fa-check"></i>';
      }, 600);
    }
  }

  // 60s Countdown Timer
  let timeLeft = 60;
  const countdownEl = document.getElementById('countdown');
  const timer = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = `${timeLeft}s`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      countdownEl.textContent = 'Muddati o\'tdi';
      countdownEl.style.color = 'var(--danger)';
    }
  }, 1000);

  // Verification Logic
  function handleVerification() {
    let code = '';
    inputs.forEach(i => code += i.value);

    const msg = document.getElementById('status-msg');

    if (code.length < 6) {
      showError("Iltimos, 6 xonali xavfsizlik kodini to'liq kiriting.");
      return;
    }
    if (!isCaptchaVerified) {
      showError("Iltimos, 'Men robot emasman' tasdig'ini bosing.");
      return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Tekshirilmoqda...';

    // Simulyatsiya (Muvaffaqiyatli kirish)
    setTimeout(() => {
      window.location.href = "/admin/";
    }, 1200);
  }

  function showError(text) {
    const msg = document.getElementById('status-msg');
    msg.className = 'status-msg error';
    msg.innerHTML = `<i class="fas fa-triangle-exclamation" style="margin-right:6px"></i> ${text}`;
  }

  function promptRecovery() {
    const key = prompt("Admin xavfsizlik (Master) kalitini kiriting:");
    if (key) {
      alert("Xavfsizlik kaliti qabul qilindi. Profil tasdiqlandi!");
      window.location.href = "/admin/";
    }
  }
</script>

</body>
</html>
